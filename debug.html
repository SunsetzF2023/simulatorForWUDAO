<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Hearthstone Simulator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #222;
            color: white;
            padding: 20px;
        }
        .debug-info {
            background: #333;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
        .loading { color: #ffd700; }
    </style>
</head>
<body>
    <h1>Debug Page</h1>
    <div id="debug-output"></div>

    <script>
        const debugOutput = document.getElementById('debug-output');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `debug-info ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            debugOutput.appendChild(div);
            console.log(message);
        }

        log('Starting debug...');
        
        // Check if modules are supported
        if ('noModule' in HTMLScriptElement.prototype) {
            log('✓ ES6 modules supported', 'success');
        } else {
            log('❌ ES6 modules not supported', 'error');
        }

        // Try to load main script
        log('Attempting to load main.js...', 'loading');
        
        const script = document.createElement('script');
        script.type = 'module';
        script.src = 'src/main.js';
        
        script.onload = () => {
            log('✓ main.js loaded successfully', 'success');
        };
        
        script.onerror = (error) => {
            log(`❌ Failed to load main.js: ${error}`, 'error');
            
            // Try to load individual modules
            log('Trying to load individual modules...', 'loading');
            testModule('src/core/gameState.js');
            testModule('src/ui/renderGame.js');
        };
        
        function testModule(modulePath) {
            const testScript = document.createElement('script');
            testScript.type = 'module';
            testScript.src = modulePath;
            
            testScript.onload = () => {
                log(`✓ ${modulePath} loaded`, 'success');
            };
            
            testScript.onerror = () => {
                log(`❌ ${modulePath} failed to load`, 'error');
            };
            
            document.head.appendChild(testScript);
        }
        
        document.head.appendChild(script);

        // Check fetch API
        log('Testing fetch API...', 'loading');
        fetch('data/heroes.json')
            .then(response => {
                if (response.ok) {
                    log('✓ data/heroes.json accessible', 'success');
                    return response.json();
                } else {
                    log(`❌ data/heroes.json returned ${response.status}`, 'error');
                }
            })
            .then(data => {
                log(`✓ heroes.json contains ${data.heroes.length} heroes`, 'success');
            })
            .catch(error => {
                log(`❌ Fetch error: ${error.message}`, 'error');
            });

        fetch('data/cards.json')
            .then(response => {
                if (response.ok) {
                    log('✓ data/cards.json accessible', 'success');
                    return response.json();
                } else {
                    log(`❌ data/cards.json returned ${response.status}`, 'error');
                }
            })
            .then(data => {
                log(`✓ cards.json contains ${data.cards.length} cards`, 'success');
            })
            .catch(error => {
                log(`❌ Fetch error: ${error.message}`, 'error');
            });

        // Check CSS
        log('Checking CSS...', 'loading');
        fetch('style.css')
            .then(response => {
                if (response.ok) {
                    log('✓ style.css accessible', 'success');
                } else {
                    log(`❌ style.css returned ${response.status}`, 'error');
                }
            })
            .catch(error => {
                log(`❌ CSS fetch error: ${error.message}`, 'error');
            });
    </script>
</body>
</html>
