<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>武道轮回模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            background: #121212;
            color: #f1c40f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* 顶部境界区域 */
        .realm-section {
            padding: 20px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border-bottom: 2px solid #f1c40f;
            text-align: center;
        }

        .realm-title {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }

        .lifespan {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #e74c3c;
        }

        .progress-container {
            width: 100%;
            height: 30px;
            background: #2c2c2c;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            border: 2px solid #f1c40f;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #f1c40f, #f39c12);
            width: 0%;
            transition: width 0.5s ease;
            animation: breathe 2s infinite;
            border-radius: 13px;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.8; box-shadow: 0 0 5px rgba(241, 196, 15, 0.5); }
            50% { opacity: 1; box-shadow: 0 0 20px rgba(241, 196, 15, 0.8); }
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            color: #000;
            text-shadow: 0 0 3px rgba(241, 196, 15, 0.8);
        }

        /* 中央抉择区域 */
        .choice-section {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .event-text {
            font-size: 1.3em;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.6;
            padding: 20px;
            background: rgba(241, 196, 15, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(241, 196, 15, 0.3);
            max-width: 600px;
        }

        .choices-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }

        .choice-btn {
            padding: 15px 20px;
            background: linear-gradient(135deg, #34495e, #2c3e50);
            border: 2px solid #f1c40f;
            color: #f1c40f;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
        }

        .choice-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
        }

        .choice-btn:disabled {
            background: #2c2c2c;
            color: #666;
            cursor: not-allowed;
            border-color: #444;
        }

        .requirement {
            font-size: 0.8em;
            color: #e74c3c;
            margin-top: 5px;
        }

        /* 苦修按钮 */
        .cultivation-btn {
            padding: 20px 40px;
            background: linear-gradient(135deg, #8e44ad, #9b59b6);
            border: 2px solid #f1c40f;
            color: #f1c40f;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .cultivation-btn:hover {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: #000;
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(241, 196, 15, 0.5);
        }

        /* 底部日志区域 */
        .log-section {
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid #f1c40f;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #f1c40f;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 5px;
            border-left: 3px solid #f1c40f;
            padding-left: 10px;
            animation: fadeIn 0.5s ease;
        }

        .log-entry.breakthrough {
            color: #f1c40f;
            border-left-color: #f1c40f;
            font-weight: bold;
        }

        .log-entry.injury {
            color: #e74c3c;
            border-left-color: #e74c3c;
        }

        .log-entry.normal {
            color: #ecf0f1;
            border-left-color: #95a5a6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #f1c40f;
            max-width: 500px;
            text-align: center;
            color: #f1c40f;
        }

        .modal-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .modal-stats {
            margin-bottom: 20px;
            text-align: left;
        }

        .modal-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            border: none;
            color: #000;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: all 0.3s ease;
        }

        .modal-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
        }

        /* 属性显示 */
        .stats-display {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background: rgba(241, 196, 15, 0.1);
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            color: #95a5a6;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #f1c40f;
        }

        /* 命格显示 */
        .destiny {
            text-align: center;
            margin: 10px 0;
            padding: 10px;
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.2), rgba(142, 68, 173, 0.2));
            border-radius: 8px;
            border: 1px solid #9b59b6;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .realm-title {
                font-size: 1.5em;
            }
            
            .choices-container {
                grid-template-columns: 1fr;
            }
            
            .event-text {
                font-size: 1.1em;
                padding: 15px;
            }
            
            .cultivation-btn {
                padding: 15px 30px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部境界区域 -->
    <div class="realm-section">
        <div class="realm-title" id="realmTitle">初出茅庐</div>
        <div class="lifespan" id="lifespan">寿命: 80岁</div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
        <div class="destiny" id="destiny">命格: 未定</div>
    </div>

    <!-- 中央抉择区域 -->
    <div class="choice-section">
        <div class="stats-display">
            <div class="stat-item">
                <div class="stat-label">体魄</div>
                <div class="stat-value" id="physique">10</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">悟性</div>
                <div class="stat-value" id="intelligence">10</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">心性</div>
                <div class="stat-value" id="mind">10</div>
            </div>
        </div>
        
        <div class="event-text" id="eventText">
            你武道之路刚刚开始，前方充满无限可能...
        </div>
        
        <div class="choices-container" id="choicesContainer">
            <!-- 动态生成选项 -->
        </div>
        
        <button class="cultivation-btn" id="cultivationBtn" onclick="cultivate()">
            闭关苦修 (消耗3个月)
        </button>
    </div>

    <!-- 底部日志区域 -->
    <div class="log-section">
        <div class="log-title">武道足迹</div>
        <div id="logContainer">
            <div class="log-entry normal">武道之路，由此开始...</div>
        </div>
    </div>

    <!-- 轮回结算模态框 -->
    <div class="modal" id="rebirthModal">
        <div class="modal-content">
            <div class="modal-title">轮回结算</div>
            <div class="modal-stats" id="rebirthStats"></div>
            <div id="karmaDisplay"></div>
            <button class="modal-btn" onclick="rebirth()">轮回转世</button>
        </div>
    </div>

    <!-- 升级模态框 -->
    <div class="modal" id="upgradeModal">
        <div class="modal-content">
            <div class="modal-title">轮回商店</div>
            <div class="modal-stats">
                <p>轮回点: <span id="karmaPoints">0</span></p>
                <p>可用提升:</p>
            </div>
            <button class="modal-btn" onclick="upgradeStat('physique')">体魄+1 (消耗10点)</button>
            <button class="modal-btn" onclick="upgradeStat('intelligence')">悟性+1 (消耗10点)</button>
            <button class="modal-btn" onclick="upgradeStat('mind')">心性+1 (消耗10点)</button>
            <button class="modal-btn" onclick="startNewLife()">开始新人生</button>
        </div>
    </div>

    <script>
        // 游戏状态
        let gameState = {
            age: 16,
            lifespan: 80,
            physique: 10,
            intelligence: 10,
            mind: 10,
            power: 10,
            realm: 0,
            realmProgress: 0,
            destiny: null,
            karma: 0,
            currentEvent: null,
            season: 0,
            year: 1
        };

        // 境界体系
        const realms = [
            { name: "初出茅庐", power: 0 },
            { name: "登堂入室", power: 50 },
            { name: "三流武者", power: 150 },
            { name: "二流武者", power: 300 },
            { name: "一流武者", power: 600 },
            { name: "武道宗师", power: 1200 },
            { name: "武道圣人", power: 2400 },
            { name: "武道至尊", power: 4800 },
            { name: "武道帝皇", power: 9600 }
        ];

        // 命格系统
        const destinies = [
            { name: "天生神力", effect: { physique: 1.2 }, description: "体魄获取+20%" },
            { name: "聪慧过人", effect: { intelligence: 1.2 }, description: "悟性获取+20%" },
            { name: "心如止水", effect: { mind: 1.2 }, description: "心性获取+20%" },
            { name: "武学奇才", effect: { intelligence: 1.3 }, description: "悟性获取+30%" },
            { name: "铜皮铁骨", effect: { physique: 1.3 }, description: "体魄获取+30%" },
            { name: "道心坚定", effect: { mind: 1.3 }, description: "心性获取+30%" },
            { name: "均衡发展", effect: { physique: 1.1, intelligence: 1.1, mind: 1.1 }, description: "全属性+10%" },
            { name: "武痴", effect: { power: 1.2 }, description: "战力成长+20%" }
        ];

        // 事件库
        const events = {
            childhood: [
                {
                    text: "你在村口看到老武师教导弟子，是否上前观摩？",
                    choices: [
                        { text: "认真学习", requirement: { intelligence: 5 }, effect: { intelligence: 2 } },
                        { text: "暗中模仿", requirement: { mind: 8 }, effect: { mind: 1, intelligence: 1 } },
                        { text: "直接拜师", requirement: {}, effect: { physique: 1, intelligence: 1 } }
                    ]
                },
                {
                    text: "山中采药时发现一株稀有草药，如何处理？",
                    choices: [
                        { text: "仔细研究", requirement: { intelligence: 10 }, effect: { intelligence: 3 } },
                        { text: "直接服用", requirement: { physique: 8 }, effect: { physique: 2 } },
                        { text: "卖掉换钱", requirement: {}, effect: { mind: 2 } }
                    ]
                }
            ],
            youth: [
                {
                    text: "江湖中听闻有秘籍出世，你是否前往争夺？",
                    choices: [
                        { text: "全力争夺", requirement: { physique: 20 }, effect: { physique: 5, power: 10 } },
                        { text: "智取秘籍", requirement: { intelligence: 25 }, effect: { intelligence: 5, power: 8 } },
                        { text: "观望时机", requirement: { mind: 20 }, effect: { mind: 3, power: 5 } }
                    ]
                },
                {
                    text: "遇到受伤的武者，是否出手相助？",
                    choices: [
                        { text: "全力救治", requirement: { mind: 15 }, effect: { mind: 4 } },
                        { text: "趁机夺宝", requirement: { physique: 18 }, effect: { physique: 3, power: 5 } },
                        { text: "默默离开", requirement: {}, effect: { mind: 1 } }
                    ]
                }
            ],
            adult: [
                {
                    text: "武林大会召开，你是否参加？",
                    choices: [
                        { text: "挑战高手", requirement: { power: 100 }, effect: { power: 20, physique: 5 } },
                        { text: "观摩学习", requirement: { intelligence: 30 }, effect: { intelligence: 8 } },
                        { text: "结交豪杰", requirement: { mind: 25 }, effect: { mind: 6, power: 10 } }
                    ]
                },
                {
                    text: "发现古洞府遗迹，是否探索？",
                    choices: [
                        { text: "勇闯洞府", requirement: { physique: 40 }, effect: { power: 30, physique: 10 } },
                        { text: "破解机关", requirement: { intelligence: 45 }, effect: { intelligence: 12, power: 25 } },
                        { text: "谨慎探索", requirement: { mind: 35 }, effect: { mind: 8, power: 15 } }
                    ]
                }
            ],
            elder: [
                {
                    text: "年轻武者前来挑战，如何应对？",
                    choices: [
                        { text: "全力应战", requirement: { power: 200 }, effect: { power: 15 } },
                        { text: "指点后辈", requirement: { intelligence: 50 }, effect: { mind: 10, intelligence: 5 } },
                        { text: "婉言谢绝", requirement: { mind: 40 }, effect: { mind: 8 } }
                    ]
                },
                {
                    text: "感悟天道，寻求突破之道",
                    choices: [
                        { text: "闭关修炼", requirement: { mind: 60 }, effect: { power: 40, realmProgress: 10 } },
                        { text: "游历天下", requirement: { physique: 50 }, effect: { mind: 15, power: 20 } },
                        { text: "传授武学", requirement: { intelligence: 55 }, effect: { intelligence: 10, mind: 10 } }
                    ]
                }
            ]
        };

        // 初始化游戏
        function initGame() {
            loadGameState();
            if (!gameState.destiny) {
                selectDestiny();
            }
            updateDisplay();
            generateEvent();
        }

        // 选择命格
        function selectDestiny() {
            const randomDestiny = destinies[Math.floor(Math.random() * destinies.length)];
            gameState.destiny = randomDestiny;
            addLog(`命格觉醒: ${randomDestiny.name} - ${randomDestiny.description}`, 'breakthrough');
        }

        // 生成事件
        function generateEvent() {
            let eventPool = [];
            
            if (gameState.age < 20) {
                eventPool = events.childhood;
            } else if (gameState.age < 40) {
                eventPool = events.youth;
            } else if (gameState.age < 60) {
                eventPool = events.adult;
            } else {
                eventPool = events.elder;
            }

            gameState.currentEvent = eventPool[Math.floor(Math.random() * eventPool.length)];
            displayEvent();
        }

        // 显示事件
        function displayEvent() {
            const eventText = document.getElementById('eventText');
            const choicesContainer = document.getElementById('choicesContainer');
            
            eventText.textContent = `${gameState.age}岁，${getSeasonText()} - ${gameState.currentEvent.text}`;
            choicesContainer.innerHTML = '';

            gameState.currentEvent.choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = choice.text;
                
                if (choice.requirement && !checkRequirement(choice.requirement)) {
                    btn.disabled = true;
                    let reqText = '<div class="requirement">需要: ';
                    for (let stat in choice.requirement) {
                        reqText += `${getStatName(stat)} ${choice.requirement[stat]} `;
                    }
                    reqText += '</div>';
                    btn.innerHTML += reqText;
                } else {
                    btn.onclick = () => makeChoice(index);
                }
                
                choicesContainer.appendChild(btn);
            });
        }

        // 检查需求
        function checkRequirement(requirement) {
            for (let stat in requirement) {
                if (gameState[stat] < requirement[stat]) {
                    return false;
                }
            }
            return true;
        }

        // 做出选择
        function makeChoice(choiceIndex) {
            const choice = gameState.currentEvent.choices[choiceIndex];
            
            // 应用效果
            for (let stat in choice.effect) {
                if (stat === 'realmProgress') {
                    gameState.realmProgress += choice.effect[stat];
                } else if (gameState.destiny.effect[stat]) {
                    gameState[stat] += Math.floor(choice.effect[stat] * gameState.destiny.effect[stat]);
                } else {
                    gameState[stat] += choice.effect[stat];
                }
            }
            
            // 更新战力
            updatePower();
            
            // 检查突破
            checkRealmBreakthrough();
            
            // 时间流逝
            passTime(3);
            
            // 生成新事件
            generateEvent();
            updateDisplay();
        }

        // 闭关苦修
        function cultivate() {
            const stats = ['physique', 'intelligence', 'mind'];
            const randomStat = stats[Math.floor(Math.random() * stats.length)];
            const increase = 1;
            
            if (gameState.destiny.effect[randomStat]) {
                gameState[randomStat] += Math.floor(increase * gameState.destiny.effect[randomStat]);
            } else {
                gameState[randomStat] += increase;
            }
            
            updatePower();
            checkRealmBreakthrough();
            passTime(3);
            
            addLog(`闭关苦修3个月，${getStatName(randomStat)}+${increase}`, 'normal');
            generateEvent();
            updateDisplay();
        }

        // 时间流逝
        function passTime(months) {
            gameState.age += months / 12;
            gameState.season = (gameState.season + months) % 12;
            gameState.year = Math.floor(gameState.age);
            
            // 每年减少寿命
            if (gameState.season === 0) {
                gameState.lifespan--;
                if (gameState.lifespan <= 0) {
                    gameState.lifespan = 0;
                    showRebirthModal();
                }
            }
        }

        // 更新战力
        function updatePower() {
            gameState.power = gameState.physique * 2 + gameState.intelligence * 3 + gameState.mind * 2;
            if (gameState.destiny.effect.power) {
                gameState.power = Math.floor(gameState.power * gameState.destiny.effect.power);
            }
        }

        // 检查境界突破
        function checkRealmBreakthrough() {
            for (let i = realms.length - 1; i >= 0; i--) {
                if (gameState.power >= realms[i].power && i > gameState.realm) {
                    gameState.realm = i;
                    gameState.realmProgress = 0;
                    addLog(`境界突破: ${realms[i].name}!`, 'breakthrough');
                    break;
                }
            }
        }

        // 更新显示
        function updateDisplay() {
            document.getElementById('realmTitle').textContent = realms[gameState.realm].name;
            document.getElementById('lifespan').textContent = `寿命: ${gameState.lifespan}岁`;
            document.getElementById('physique').textContent = gameState.physique;
            document.getElementById('intelligence').textContent = gameState.intelligence;
            document.getElementById('mind').textContent = gameState.mind;
            
            if (gameState.destiny) {
                document.getElementById('destiny').textContent = `命格: ${gameState.destiny.name}`;
            }
            
            // 更新进度条
            const currentRealmPower = realms[gameState.realm].power;
            const nextRealmPower = realms[Math.min(gameState.realm + 1, realms.length - 1)].power;
            const progress = currentRealmPower === 0 ? 0 : 
                Math.min(((gameState.power - currentRealmPower) / (nextRealmPower - currentRealmPower)) * 100, 100);
            
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressText').textContent = Math.floor(progress) + '%';
        }

        // 添加日志
        function addLog(text, type = 'normal') {
            const logContainer = document.getElementById('logContainer');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.textContent = text;
            logContainer.insertBefore(logEntry, logContainer.firstChild);
            
            // 限制日志数量
            while (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        // 显示轮回结算
        function showRebirthModal() {
            const modal = document.getElementById('rebirthModal');
            const stats = document.getElementById('rebirthStats');
            const karmaDisplay = document.getElementById('karmaDisplay');
            
            // 计算轮回点
            const realmWeight = (gameState.realm + 1) * 10;
            const survivalBonus = Math.floor(gameState.age) * 2;
            const totalKarma = realmWeight + survivalBonus;
            
            gameState.karma += totalKarma;
            
            stats.innerHTML = `
                <p>最高境界: ${realms[gameState.realm].name}</p>
                <p>享年: ${Math.floor(gameState.age)}岁</p>
                <p>最终战力: ${gameState.power}</p>
                <p>本次轮回点: +${totalKarma}</p>
            `;
            
            karmaDisplay.textContent = `总轮回点: ${gameState.karma}`;
            modal.style.display = 'flex';
            
            saveGameState();
        }

        // 轮回转世
        function rebirth() {
            document.getElementById('rebirthModal').style.display = 'none';
            document.getElementById('upgradeModal').style.display = 'flex';
            document.getElementById('karmaPoints').textContent = gameState.karma;
        }

        // 升级属性
        function upgradeStat(stat) {
            if (gameState.karma >= 10) {
                gameState.karma -= 10;
                gameState[stat] += 5; // 每次永久增加5点
                document.getElementById('karmaPoints').textContent = gameState.karma;
                addLog(`轮回加持: ${getStatName(stat)}永久+5`, 'breakthrough');
            }
        }

        // 开始新人生
        function startNewLife() {
            // 重置游戏状态但保留部分属性
            const savedPhysique = gameState.physique;
            const savedIntelligence = gameState.intelligence;
            const savedMind = gameState.mind;
            const savedKarma = gameState.karma;
            
            gameState = {
                age: 16,
                lifespan: 80,
                physique: Math.max(10, savedPhysique),
                intelligence: Math.max(10, savedIntelligence),
                mind: Math.max(10, savedMind),
                power: 0,
                realm: 0,
                realmProgress: 0,
                destiny: null,
                karma: savedKarma,
                currentEvent: null,
                season: 0,
                year: 1
            };
            
            document.getElementById('upgradeModal').style.display = 'none';
            document.getElementById('logContainer').innerHTML = '<div class="log-entry normal">新的轮回，新的开始...</div>';
            
            selectDestiny();
            updatePower();
            updateDisplay();
            generateEvent();
            saveGameState();
        }

        // 获取季节文本
        function getSeasonText() {
            const seasons = ['春', '夏', '秋', '冬'];
            return seasons[Math.floor(gameState.season / 3)];
        }

        // 获取属性名称
        function getStatName(stat) {
            const names = {
                physique: '体魄',
                intelligence: '悟性',
                mind: '心性',
                power: '战力'
            };
            return names[stat] || stat;
        }

        // 保存游戏状态
        function saveGameState() {
            localStorage.setItem('wudaoGameState', JSON.stringify(gameState));
        }

        // 加载游戏状态
        function loadGameState() {
            const saved = localStorage.getItem('wudaoGameState');
            if (saved) {
                const loadedState = JSON.parse(saved);
                // 合并状态，确保所有必要字段存在
                Object.assign(gameState, loadedState);
            }
        }

        // 页面加载完成后初始化游戏
        window.onload = initGame;
        
        // 页面关闭前保存游戏
        window.onbeforeunload = saveGameState;
    </script>
</body>
</html>
