<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office War - 职场大战</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- 游戏头部信息 -->
        <header id="game-header">
            <div class="player-info">
                <h3>玩家</h3>
                <div class="salary-display">工资: <span id="player-salary">1</span>/10</div>
                <div class="deck-info">卡组: <span id="deck-count">20</span></div>
                <div class="hero-hp">现金流: <span id="player-hero-hp">30</span></div>
            </div>
            <div class="turn-info">
                <div class="turn-counter">回合: <span id="turn-number">1</span></div>
                <button id="end-turn-btn" class="btn-primary">结束回合</button>
            </div>
            <div class="opponent-info">
                <h3>对手</h3>
                <div class="hero-hp">现金流: <span id="opponent-hp">30</span></div>
            </div>
        </header>

        <!-- 游戏主区域 -->
        <main id="game-board">
            <!-- 对手场地 -->
            <section id="opponent-board" class="board-section">
                <h4>对手场地</h4>
                <div id="opponent-minions" class="minions-container"></div>
            </section>

            <!-- 手牌区域 -->
            <section id="hand-section" class="board-section">
                <h4>手牌</h4>
                <div id="player-hand" class="hand-container"></div>
            </section>

            <!-- 玩家场地 -->
            <section id="player-board" class="board-section">
                <h4>我的场地</h4>
                <div id="player-minions" class="minions-container"></div>
            </section>
        </main>

        <!-- 游戏信息面板 -->
        <aside id="game-info">
            <div class="info-panel">
                <h4>游戏日志</h4>
                <div id="game-log" class="log-container"></div>
            </div>
            <div class="info-panel">
                <h4>卡牌详情</h4>
                <div id="card-details" class="card-details">
                    <p>将鼠标悬停在卡牌上查看详情</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- 模态框 -->
    <div id="modal-overlay" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-title">游戏结束</h3>
            <p id="modal-message"></p>
            <button id="modal-close" class="btn-primary">确定</button>
        </div>
    </div>

    <!-- JavaScript 模块 -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
