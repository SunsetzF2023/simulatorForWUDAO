<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hearthstone Simulator (Safe Mode)</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-family: 'Inter', sans-serif;
        }
        .loading-content {
            text-align: center;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading">
        <div class="loading-content">
            <div class="spinner"></div>
            <h2>Loading Hearthstone Simulator...</h2>
            <p>Please wait while we prepare your game.</p>
        </div>
    </div>

    <div id="game-container">
        <!-- Opponent Section -->
        <div class="opponent-section">
            <div class="hero-area" id="opponent-hero">
                <!-- Hero will be rendered here -->
            </div>
            <div class="mana-area" id="opponent-mana">
                <!-- Mana will be rendered here -->
            </div>
            <div class="board-area" id="opponent-board">
                <!-- Minions will be rendered here -->
            </div>
            <div class="hand-area" id="opponent-hand">
                <!-- Hand cards will be rendered here -->
            </div>
            <div class="deck-area" id="opponent-deck">
                <!-- Deck count will be rendered here -->
            </div>
        </div>

        <!-- Turn Indicator -->
        <div class="turn-indicator" id="turn-indicator">
            Your Turn
        </div>

        <!-- Player Section -->
        <div class="player-section">
            <div class="hand-area" id="player-hand">
                <!-- Hand cards will be rendered here -->
            </div>
            <div class="board-area" id="player-board">
                <!-- Minions will be rendered here -->
            </div>
            <div class="hero-area" id="player-hero">
                <!-- Hero will be rendered here -->
            </div>
            <div class="mana-area" id="player-mana">
                <!-- Mana will be rendered here -->
            </div>
            <div class="deck-area" id="player-deck">
                <!-- Deck count will be rendered here -->
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <button id="end-turn-btn" class="btn btn-primary">End Turn</button>
            <button id="hero-power-btn" class="btn btn-secondary">Hero Power</button>
        </div>

        <!-- Game Log -->
        <div class="game-log-container">
            <h3>Game Log</h3>
            <div id="game-log" class="game-log">
                <!-- Log messages will appear here -->
            </div>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="game-over-overlay" class="overlay hidden">
        <!-- Game over content will be rendered here -->
    </div>

    <!-- Tooltips -->
    <div id="card-tooltip" class="tooltip hidden"></div>
    <div id="minion-tooltip" class="tooltip hidden"></div>
    <div id="hero-tooltip" class="tooltip hidden"></div>

    <script type="module" src="src/main-safe.js"></script>
</body>
</html>
