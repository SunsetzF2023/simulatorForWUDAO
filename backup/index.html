<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>武道轮回模拟器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部境界区域 -->
    <div class="realm-section">
        <div class="realm-title" id="realmTitle">初出茅庐</div>
        <div class="lifespan" id="lifespan">寿命: 80岁</div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
        <div class="destiny" id="destiny">命格: 未定</div>
    </div>

    <!-- 中央抉择区域 -->
    <div class="choice-section">
        <div class="stats-display">
            <div class="stat-item">
                <div class="stat-label">体魄</div>
                <div class="stat-value" id="physique">10</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">悟性</div>
                <div class="stat-value" id="intelligence">10</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">心性</div>
                <div class="stat-value" id="mind">10</div>
            </div>
        </div>
        
        <div class="event-text" id="eventText">
            你武道之路刚刚开始，前方充满无限可能...
        </div>
        
        <div class="choices-container" id="choicesContainer">
            <!-- 动态生成选项 -->
        </div>
        
        <button class="cultivation-btn" id="cultivationBtn">
            闭关苦修 (消耗3个月)
        </button>
    </div>

    <!-- 底部日志区域 -->
    <div class="log-section">
        <div class="log-title">武道足迹</div>
        <div id="logContainer">
            <div class="log-entry normal">武道之路，由此开始...</div>
        </div>
    </div>

    <!-- 轮回结算模态框 -->
    <div class="modal" id="rebirthModal">
        <div class="modal-content">
            <div class="modal-title">轮回结算</div>
            <div class="modal-stats" id="rebirthStats"></div>
            <div id="karmaDisplay"></div>
            <button class="modal-btn" id="rebirthBtn">轮回转世</button>
        </div>
    </div>

    <!-- 升级模态框 -->
    <div class="modal" id="upgradeModal">
        <div class="modal-content">
            <div class="modal-title">轮回商店</div>
            <div class="modal-stats">
                <p>轮回点: <span id="karmaPoints">0</span></p>
                <p>可用提升:</p>
            </div>
            <button class="modal-btn" id="upgradePhysique">体魄+1 (消耗10点)</button>
            <button class="modal-btn" id="upgradeIntelligence">悟性+1 (消耗10点)</button>
            <button class="modal-btn" id="upgradeMind">心性+1 (消耗10点)</button>
            <button class="modal-btn" id="startNewLife">开始新人生</button>
        </div>
    </div>

    <!-- 模块化JavaScript入口 -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
